<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Set New Password')}"></head>
<body style="background-color: var(--bg-secondary);">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="swaped-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="category-icon-box mx-auto mb-3"><i class="bi bi-shield-lock"></i></span>
                        <h3 class="fw-bold mb-1">Create New Password</h3>
                        <p class="text-secondary small mb-0" th:if="${studentEmail != null}">
                            Setting a new password for <strong class="text-dark font-mono-code" th:text="${studentEmail}"></strong>
                        </p>
                    </div>

                    <form th:action="@{/auth/reset-password}" th:object="${resetConfirmDto}" method="post" novalidate>
                        <input type="hidden" th:field="*{token}">

                        <div class="mb-3">
                            <label for="newPassInput" class="form-label">New Password</label>
                            <div class="input-group">
                                <input type="password" id="newPassInput" th:field="*{newPassword}"
                                       class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                       placeholder="Min. 8 characters" required>
                                <button type="button" class="btn btn-soft border" data-toggle-password="newPassInput" style="font-size: 0.82rem;">Show</button>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmNewPassInput" class="form-label">Confirm New Password</label>
                            <div class="input-group">
                                <input type="password" id="confirmNewPassInput" th:field="*{confirmPassword}"
                                       class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                       placeholder="Repeat new password" required>
                                <button type="button" class="btn btn-soft border" data-toggle-password="confirmNewPassInput" style="font-size: 0.82rem;">Show</button>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-emerald w-100 py-2">
                            Update Password <i class="bi bi-check2-circle ms-1"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
