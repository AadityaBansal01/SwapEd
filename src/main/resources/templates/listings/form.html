<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit ? 'Edit Listing' : 'Sell an Item'})}"></head>
<body style="background-color: var(--bg-secondary);">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="py-4 py-lg-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="swaped-card p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-start mb-4 pb-3 border-bottom">
                        <div>
                            <span class="text-uppercase fw-bold small" style="color: var(--emerald-600); letter-spacing: 0.06em;"
                                  th:text="${isEdit ? 'Update Listing' : 'Campus Seller Studio'}">Campus Seller Studio</span>
                            <h2 class="fw-bold mb-1" style="letter-spacing: -0.02em;"
                                th:text="${isEdit ? 'Edit Marketplace Listing' : 'Sell Academic Book or Gear'}">Sell an Item</h2>
                            <p class="text-secondary small mb-0">
                                List your textbook, lab coat, drafting tool, or calculator for fellow Thapar students.
                            </p>
                        </div>
                        <a th:href="${isEdit ? '/dashboard/listings' : '/marketplace'}" class="btn btn-soft btn-sm">Cancel</a>
                    </div>

                    <form th:action="${isEdit ? '/listings/' + listingDto.listingId + '/update' : '/listings/create'}"
                          th:object="${listingDto}"
                          method="post"
                          enctype="multipart/form-data"
                          novalidate>

                        <div class="row g-3">
                            <!-- Item Title -->
                            <div class="col-12">
                                <label for="titleInput" class="form-label">Item Title <span class="text-danger">*</span></label>
                                <input type="text" id="titleInput" th:field="*{title}"
                                       class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       placeholder="e.g., Introduction to Algorithms (CLRS) — 3rd Edition" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>

                            <!-- Category & Condition -->
                            <div class="col-md-6">
                                <label for="categorySelect" class="form-label">Category <span class="text-danger">*</span></label>
                                <select id="categorySelect" th:field="*{categoryId}"
                                        class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'" required>
                                    <option value="">Select Category</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.categoryId}"
                                            th:text="${cat.categoryName}">Category</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="conditionSelect" class="form-label">Condition <span class="text-danger">*</span></label>
                                <select id="conditionSelect" th:field="*{itemCondition}"
                                        class="form-select" th:classappend="${#fields.hasErrors('itemCondition')} ? 'is-invalid'" required>
                                    <option value="">Select Condition</option>
                                    <option th:each="cond : ${conditions}"
                                            th:value="${cond.name()}"
                                            th:text="${cond.displayName} + ' — ' + ${cond.description}">Condition</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('itemCondition')}" th:errors="*{itemCondition}"></div>
                            </div>

                            <!-- Course Code & Course Name -->
                            <div class="col-md-4">
                                <label for="courseCodeInput" class="form-label">Course Code <span class="text-danger">*</span></label>
                                <input type="text" id="courseCodeInput" th:field="*{courseCode}"
                                       class="form-control font-mono-code text-uppercase"
                                       th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid'"
                                       placeholder="e.g., UCS301, UMA010" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}"></div>
                            </div>

                            <div class="col-md-8">
                                <label for="courseNameInput" class="form-label">Course Name <span class="text-danger">*</span></label>
                                <input type="text" id="courseNameInput" th:field="*{courseName}"
                                       class="form-control" th:classappend="${#fields.hasErrors('courseName')} ? 'is-invalid'"
                                       placeholder="e.g., Data Structures and Algorithms" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}"></div>
                            </div>

                            <!-- Selling Price & Original Price -->
                            <div class="col-md-6">
                                <label for="sellingPriceInput" class="form-label">Selling Price (INR ₹) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light font-mono-code">₹</span>
                                    <input type="number" step="0.01" min="0" id="sellingPriceInput" th:field="*{sellingPrice}"
                                           class="form-control font-mono-code"
                                           th:classappend="${#fields.hasErrors('sellingPrice')} ? 'is-invalid'"
                                           placeholder="450.00" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('sellingPrice')}" th:errors="*{sellingPrice}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="originalPriceInput" class="form-label">Original Price / MRP (Optional)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light font-mono-code">₹</span>
                                    <input type="number" step="0.01" min="0" id="originalPriceInput" th:field="*{originalPrice}"
                                           class="form-control font-mono-code"
                                           th:classappend="${#fields.hasErrors('originalPrice')} ? 'is-invalid'"
                                           placeholder="950.00">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('originalPrice')}" th:errors="*{originalPrice}"></div>
                                </div>
                            </div>

                            <!-- Pickup Location -->
                            <div class="col-12">
                                <label for="pickupLocationInput" class="form-label">Campus Pickup Location <span class="text-danger">*</span></label>
                                <input type="text" id="pickupLocationInput" th:field="*{pickupLocation}"
                                       class="form-control" th:classappend="${#fields.hasErrors('pickupLocation')} ? 'is-invalid'"
                                       list="thaparPickupLocations"
                                       placeholder="e.g., Central Library (Nava Nalanda) Entrance, COS Complex, TAN Lobby" required>
                                <datalist id="thaparPickupLocations">
                                    <option value="Central Library (Nava Nalanda) Entrance"></option>
                                    <option value="COS Complex Café Seating"></option>
                                    <option value="TAN Building Ground Floor Lobby"></option>
                                    <option value="CSED Department Atrium"></option>
                                    <option value="LT-101 Foyer (Academic Block)"></option>
                                    <option value="G-Block Chemistry Lab Corridor"></option>
                                    <option value="Workshop Block Entrance"></option>
                                    <option value="Main Auditorium Steps"></option>
                                    <option value="Hostel J Main Gate"></option>
                                </datalist>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('pickupLocation')}" th:errors="*{pickupLocation}"></div>
                            </div>

                            <!-- Description -->
                            <div class="col-12">
                                <label for="descriptionInput" class="form-label">Detailed Description <span class="text-danger">*</span></label>
                                <textarea id="descriptionInput" th:field="*{description}" rows="4"
                                          class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                          placeholder="Describe edition, author, size, included accessories, or any highlights/notes..." required></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>

                            <!-- Product Image Upload -->
                            <div class="col-12">
                                <label for="imageFileInput" class="form-label">Upload Product Image (JPG, PNG, WEBP, SVG — Max 5 MB)</label>
                                <input type="file" id="imageFileInput" name="imageFile" class="form-control" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml">
                                <div class="form-text small">
                                    Upload a photo of your item. If omitted, SwapEd automatically assigns a clean category illustration.
                                </div>

                                <div id="imagePreviewContainer" class="mt-3" th:classappend="${listingDto.existingImagePath == null} ? 'd-none'">
                                    <div class="small text-secondary mb-1">Image Preview:</div>
                                    <img id="imagePreviewElement"
                                         th:src="${listingDto.existingImagePath != null ? listingDto.existingImagePath : ''}"
                                         alt="Preview"
                                         class="rounded-3 border"
                                         style="max-height: 160px; object-fit: cover;">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="${isEdit ? '/dashboard/listings' : '/marketplace'}" class="btn btn-soft px-4">Cancel</a>
                            <button type="submit" class="btn btn-emerald px-4">
                                <i class="bi bi-check2-circle me-1"></i>
                                <span th:text="${isEdit ? 'Save Changes' : 'Publish Listing'}">Publish Listing</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
