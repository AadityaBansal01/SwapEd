# ============================================================================
# SwapEd — Campus Student Book & Gear Exchange
# Application Configuration
# ============================================================================

spring.application.name=SwapEd
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ----------------------------------------------------------------------------
# MySQL Database Configuration (swap_ed_db)
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swap_ed_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.FallbackUrl=${DB_FALLBACK_URL:jdbc:mysql://127.0.0.1:3307/swap_ed_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ----------------------------------------------------------------------------
# Thymeleaf Template Configuration
# ----------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ----------------------------------------------------------------------------
# Multipart File Upload Configuration
# ----------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
swaped.upload.dir=${UPLOAD_DIR:uploads}

# ----------------------------------------------------------------------------
# Student Authentication & Domain Policy
# ----------------------------------------------------------------------------
swaped.auth.allowed-domain=${ALLOWED_EMAIL_DOMAIN:thapar.edu}
swaped.auth.verification-expiry-hours=24
swaped.auth.reset-expiry-minutes=30
swaped.app.base-url=${APP_BASE_URL:http://localhost:8080}

# ----------------------------------------------------------------------------
# Java Mail Sender (SMTP Configuration via Environment Variables)
# ----------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
swaped.mail.from=${MAIL_FROM:noreply@swaped.thapar.edu}

# ----------------------------------------------------------------------------
# Session & Security Configuration
# ----------------------------------------------------------------------------
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=always
